<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkVault — Bookmark & Collection Manager</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome 6 (CDN) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body class="bg-white text-slate-900 font-sans antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="app" class="min-h-screen flex items-center justify-center p-6">
      <div class="max-w-md w-full rounded-xl border border-slate-200 p-6 text-center dark:border-slate-800">
        <div class="mx-auto mb-3 flex h-11 w-11 items-center justify-center rounded-lg bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900">
          <i class="fa-solid fa-bookmark"></i>
        </div>
        <h1 class="text-xl font-semibold tracking-tight">LinkVault Starter</h1>
        <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
          Tailwind CSS, Font Awesome, Google Fonts (Inter), and <code class="text-xs">localStorage</code> DB are ready.
        </p>
        <p id="db-status" class="mt-4 text-xs font-medium text-emerald-600 dark:text-emerald-400"></p>
      </div>
    </div>

    <script defer src="./js/db.js"></script>
    <script defer src="./js/app.js"></script>
  </body>
</html>
