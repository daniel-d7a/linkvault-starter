<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkVault — Bookmark & Collection Manager</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./styles/main.css" />
</head>

<body>
  <aside class="w-[225px] ">
    <!-- Logo -->
    <div class="flex items-center gap-[10px] px-[16px] py-[11.62px] ">
      <i
        class="fa-regular fa-bookmark bg-[#0F172B] w-[31.99px] h-[31.99px] rounded-[8px] text-white flex items-center justify-center"></i>
      <h1 class="font-[600] text-[16px] text-[#0F172B]  leading-[24px]">LinkVault</h1>
    </div>


    <hr class="mt-[12px] border-b border-[#e2e8f0]">


    <!-- Smart Views -->
    <div class="pt-[16px] px-[12px] ">
      <h2 class="font-semibold text-[12px] leading-[16px] tracking-[0.6px] text-[#90A1B9]">SMART
        VIEWS</h2>
      <div class="flex px-[10px] py-[8px]  justify-start items-center">
        <i class="fa-regular fa-bookmark size-[12px] text-[#62748E] mr-[10px]"></i>
        <a href="#" class="font-medium text-[14px] leading-[12px] text-[#45556C]">All Bookmarks</a>
      </div>
      <div class="flex px-[10px] py-[8px]  justify-start items-center">
        <i class="fa-regular fa-star size-[12px] text-[#62748E] mt-[-4px] mr-[13px] ml-[-3px]"></i>
        <a href="#" class="font-medium text-[14px] leading-[12px] text-[#45556C]">Favorites</a>
      </div>
    </div>



    <!-- COLLECTIONS -->
    <div>

    </div>
  </aside>
  <script defer src="./js/db.js"></script>
</body>

</html>
