<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkVault — Bookmark & Collection Manager</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome 6 (CDN) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div class="py-3 px-6 flex justify-between items-center">
      <div
        class="flex items-center gap-2 rounded-[8px] border border-[#E2E8F0] pt-[7.75px] pr-[31.75px] pb-[8.9px] pl-[12px] bg-[#F8FAFCB2]"
      >
        <img src="./assets/SVG.png" alt="search Icon" />
        <input
          type="text"
          placeholder="Search titles, URLs, notes..."
          class="outline-none search-input"
        />
      </div>
    </div>

    <main>
      <div class="flex justify-between items-center">
        <div>
          <h1
            class="text-[20px] font-[600] tracking-[-0.5px] line-height:[16px] text-[#0F172B]"
          >
            All Bookmarks
          </h1>
          <span class="text-[12px] text-[#62748E] line-height:[16px]"
            >7 bookmarks</span
          >
        </div>
        <div>
          <button
            class="py-[5.75px] px-[11.75px] flex items-center gap-[5.99px] rounded-[8px] text-[12px] text-[#314158] border shadow"
          >
            <i class="fa-solid fa-arrow-up-right-from-square"></i> Open All
          </button>
        </div>
      </div>
      <!-- cards section -->
      <section
        class="card grid grid-cols-1 gap-[18px] md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-[21px]"
      >
        <!-- card -->
      </section>
    </main>

    <script defer src="./js/db.js"></script>
    <script defer src="./js/index.js"></script>
  </body>
</html>
