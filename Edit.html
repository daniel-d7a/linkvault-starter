<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkVault — Bookmark & Collection Manager</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome 6 (CDN) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body
    class="bg-white text-slate-900 font-sans antialiased dark:bg-slate-950 dark:text-slate-100"
  >
    <button
      class="border border-black bg-black text-white py-2 px-4 rounded-lg"
      onclick="my_modal_3.showModal()"
    >
      Edit
    </button>
    <div class="">
      <dialog id="my_modal_3" class="modal py-4 px-5 rounded-xl w-">
        <div class="modal-box">
          <form method="dialog">
            <button
              class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2"
            >
              ✕
            </button>
          </form>
          <h1 class="text-lg font-bold">Add Bookmark</h1>
        </div>
        <div class="flex flex-col gap-4">
          <div>
            <label for="">URL</label>
            <div class="flex gap-1">
              <input
                placeholder="https://example.com/article"
                type="text"
                class="border-2 border-[#e2e9f0] rounded-lg py-3 px-8 flex-1"
              />
              <button
                class="border bg-[#e2e9f0] rounded-lg p-2 flex gap-1 items-center"
              >
                <img src="./asssets/SVG.svg" width="14px" alt="" />Fetch Preview
              </button>
            </div>
          </div>
          <div>
            <label for="">Title</label>
            <div class="flex gap-1">
              <input
                placeholder="Page title"
                type="text"
                class="border-2 border-[#e2e9f0] rounded-lg py-3 px-8 flex-1"
              />
            </div>
          </div>
          <div>
            <label for="">Discription</label>
            <div class="flex gap-1">
              <input
                placeholder="Short Summary"
                type="text"
                class="border-2 border-[#e2e9f0] rounded-lg py-3 px-8 flex-1"
              />
            </div>
          </div>
          <div>
            <label for="">Cover Image URL</label>
            <div class="flex gap-1">
              <input
                placeholder="https://example.com/og-image.png"
                type="text"
                class="border-2 border-[#e2e9f0] rounded-lg py-3 px-8 flex-1"
              />
            </div>
          </div>
          <div>
            <label for="">Collection</label>
            <div class="flex gap-1">
              <select
                name=""
                id=""
                class="flex-1 border border-black py-2 px-4 rounded-lg"
              >
                <option value="">No Collection</option>
                <option value="">frontend and react</option>
                <option value="">ai and tools</option>
                <option value="">reading list</option>
              </select>
            </div>
          </div>
          <div>
            <label for="">Notes</label>
            <div class="flex gap-1">
              <input
                placeholder="Personal notes or key takeaways..."
                type="text"
                class="border-2 border-[#e2e9f0] rounded-lg py-3 px-8 flex-1"
              />
            </div>
          </div>
          <div class="ml-auto">
            <button class="border border-[#e2e9f0] py-2 px-4 rounded-lg">
              Cancel
            </button>
            <button
              class="border border-black bg-black text-white py-2 px-4 rounded-lg"
            >
              Save Bookmark
            </button>
          </div>
        </div>
      </dialog>
    </div>

    <script defer src="./js/db.js"></script>
  </body>
</html>
